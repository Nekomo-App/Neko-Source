plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace "com.lagradost.shiro"
    compileSdk 35

    defaultConfig {
        buildConfigField("boolean", "BETA", "false")
        // Hack :)
        buildConfigField("String", "BUILDDATE", "new java.text.SimpleDateFormat(\"yyyy-MM-dd HH:mm\").format(new java.util.Date(" + System.currentTimeMillis() + "L));")
        buildConfigField("String", "ID", '"' + (System.getenv("API_KEY") ?: "") + '"')
        vectorDrawables.useSupportLibrary = true
        applicationId "app.nekomo"
        minSdkVersion 24
        targetSdkVersion 34
        // Don't forget to update versionCode too :)
        versionCode 38
        versionName "2.9.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions "version"
    productFlavors {
        phone {
            dimension "version"
        }
        tv {
            dimension "version"
            applicationIdSuffix ".tv"
        }
    }
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            packagingOptions {
                pickFirst 'kotlin/**'
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            buildConfigField("boolean", "BETA", "true")
            applicationIdSuffix ".debug"
            versionNameSuffix '-DEBUG'
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            buildConfigField("boolean", "BETA", "true")
            applicationIdSuffix ".beta"
            versionNameSuffix '-Beta'
            matchingFallbacks = ['release']
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // https://stackoverflow.com/questions/44342455/more-than-one-file-was-found-with-os-independent-path-meta-inf-license
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.4.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.4"
    testImplementation 'androidx.test:core:1.6.1'

    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation "com.squareup.moshi:moshi:1.15.1"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.17.2"

    // Exoplayer
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:extension-cast:2.19.1'
    implementation "com.google.android.exoplayer:extension-mediasession:2.19.1"
    implementation "com.google.android.exoplayer:extension-leanback:2.19.1"

    // Bug reports
    implementation "ch.acra:acra-core:5.11.3"
    implementation "ch.acra:acra-toast:5.11.3"

    // Parallax scroll — vendored in com.nirhart.parallaxscroll.views (jitpack build dead)

    // Blur
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    // Css selectors
    implementation 'org.jsoup:jsoup:1.18.1'

    // Networking (backs khttp/KHttp.kt) + DNS over HTTPS support for the "DNS over HTTPS" setting
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.3.2'

    // CloudStream extension (.cs3) support. libs/cs3api.jar holds the cloudstream3 API
    // classes plugins are compiled against; the deps below are the runtime libraries
    // those classes (and the plugins themselves) reference. Versions mirror upstream
    // cloudstream's gradle/libs.versions.toml.
    implementation 'com.github.Blatzar:NiceHttp:0.4.18'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-io-core:0.9.1'
    implementation 'org.jetbrains.kotlinx:atomicfu:0.33.0'
    implementation 'com.fleeksoft.ksoup:ksoup:0.2.6'
    implementation 'io.ktor:ktor-http:3.5.0'
    implementation 'io.coil-kt.coil3:coil:3.2.0'

    // Aniyomi / Mihon extension runtime (extensions are loaded from APKs the user installs in-app)
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.3.2'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.3'
    implementation 'dev.whyoleg.cryptography:cryptography-core:0.6.0'
    implementation 'dev.whyoleg.cryptography:cryptography-provider-optimal:0.6.0'

    // TV
    implementation "androidx.leanback:leanback:1.0.0"
    implementation "androidx.leanback:leanback-paging:1.1.0-alpha11"

    // leanback-preference is an add-on that provides a settings UI for TV apps.
    implementation "androidx.leanback:leanback-preference:1.1.0-rc01"

    // leanback-tab is an add-on that provides customized TabLayout to be used as the top navigation bar.
    implementation "androidx.leanback:leanback-tab:1.1.0-beta01"

    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Theme
    implementation 'com.jaredrummler:cyanea:1.0.2'

    // Downloading
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // For MAL list
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // Nice anime info ui
    implementation 'com.github.discord:OverlappingPanels:0.1.3'

    // Acra
    compileOnly "com.google.auto.service:auto-service-annotations:1.1.1"
    kapt "com.google.auto.service:auto-service:1.1.1"
}

// ---- Builds live in /apks (the main build directory) -----------------------------------------------------------
// ./gradlew collectApks      copies whatever was built into apks/Nekomo-<phone|tv>-<release|beta|debug>.apk and
//                            rewrites apks/latest.json (version, size, sha256, build time) which the website reads.
// ./gradlew assembleAllApks  builds all six variants, then runs collectApks.
tasks.register('collectApks') {
    group = 'distribution'
    description = 'Copies built APKs into /apks and writes apks/latest.json'
    doLast {
        def out = rootProject.file('apks')
        out.mkdirs()
        def builds = []
        ['phone', 'tv'].each { flavor ->
            ['release', 'beta', 'debug'].each { type ->
                def src = layout.buildDirectory.file("outputs/apk/${flavor}/${type}/app-${flavor}-${type}.apk").get().asFile
                if (!src.exists()) return
                // TV builds are always labelled "TV" in the file name; the debug build type is the "alpha" channel
                def label = flavor == 'tv' ? 'TV' : flavor
                def channelName = type == 'debug' ? 'alpha' : type
                def dest = new File(out, "Nekomo-${label}-${channelName}.apk")
                java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                def sha = java.security.MessageDigest.getInstance('SHA-256').digest(dest.bytes).collect { String.format('%02x', it) }.join()
                builds << [file: dest.name, flavor: flavor, channel: type == 'release' ? 'stable' : (type == 'debug' ? 'alpha' : type), size: dest.length(), sha256: sha,
                           builtAt: new Date(src.lastModified()).format("yyyy-MM-dd'T'HH:mm:ssXXX")]
            }
        }
        def meta = [version: android.defaultConfig.versionName, versionCode: android.defaultConfig.versionCode, builds: builds]
        new File(out, 'latest.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta)) + "\n"
        println "Collected ${builds.size()} APK(s) into ${out}"
    }
}

tasks.register('assembleAllApks') {
    group = 'distribution'
    description = 'Builds all six variants and collects them into /apks'
    finalizedBy 'collectApks'
}
afterEvaluate {
    tasks.named('assembleAllApks') {
        dependsOn(['PhoneRelease', 'PhoneBeta', 'PhoneDebug', 'TvRelease', 'TvBeta', 'TvDebug'].collect { "assemble${it}" })
    }
    tasks.named('collectApks') { mustRunAfter(tasks.matching { it.name.startsWith('assemble') && it.name != 'assembleAllApks' }) }
}
